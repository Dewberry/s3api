version: '3.9'

services:
  s3api:
    container_name: s3api_api
    build:
      context: .
      target: dev
    ports:
      - '5005:5005'
    env_file:
      - ./.env
    volumes:
      - ./:/app
    networks:
      - s3_net
    depends_on:
      s3mock:
        condition: service_started
        required: false # only started with the "s3mock" profile
      postgres:
        condition: service_healthy

  # Free, in-memory S3 mock (Moto, Apache-2.0) used when S3_MOCK=1.
  # Opt-in only, so the image is not pulled unless mocking S3.
  # Enable with S3_MOCK=1 plus COMPOSE_PROFILES=s3mock in .env
  # (or `docker compose --profile s3mock up`).
  # Host port 9000 is kept because presigned upload URLs in mock mode
  # are generated for http://localhost:9000 (see blobstore/upload.go).
  s3mock:
    container_name: s3api_s3mock
    image: motoserver/moto:5.1.0
    profiles: ['s3mock']
    ports:
      - '9000:5000'
    networks:
      - s3_net

  postgres:
    container_name: s3api_postgres
    image: postgres:16.1-alpine3.18
    deploy:
      replicas: $AUTH_LEVEL
    env_file:
      - .env
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    networks:
      - s3_net

networks:
  s3_net:
    driver: bridge
